name: CI - Build & Push Images (GHCR via PAT)

on:
  push:
    branches: ["main"]

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set tag (short SHA)
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR (PAT)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Show target tags
        run: |
          echo "Owner(repo)=${{ github.repository_owner }}"
          echo "Tag=${IMAGE_TAG}"
          echo "orders-api => ghcr.io/${{ github.repository_owner }}/pedidos-estoque/orders-api:${IMAGE_TAG}"
          echo "status-api => ghcr.io/${{ github.repository_owner }}/pedidos-estoque/status-api:${IMAGE_TAG}"
          echo "frontend  => ghcr.io/${{ github.repository_owner }}/pedidos-estoque/frontend:${IMAGE_TAG}"

      - name: Build & push orders-api
        uses: docker/build-push-action@v6
        with:
          context: ./orders-api
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/pedidos-estoque/orders-api:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push status-api
        uses: docker/build-push-action@v6
        with:
          context: ./status-api
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/pedidos-estoque/status-api:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/pedidos-estoque/frontend:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
